# Publish a Plugin Release when a tag `vMAJOR.MINOR.PATCH` is pushed (ADR-0003).
#
# The work is FirstMate's reusable workflow: it runs `test`, runs `build`, and
# uploads the archive of release/ with its .sha256. It is called at @main, the
# only ref a called workflow can match with its own scripts.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: luanAfons0/FirstMate/.github/workflows/plugin-release.yml@main
    # The workflow creates the GitHub Release, so it needs this, and nothing more.
    permissions:
      contents: write
    with:
      test: npm ci && npm test
      build: npm run release
